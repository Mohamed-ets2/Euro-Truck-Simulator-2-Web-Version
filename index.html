<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Truck Driver</title>


    <style>

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #53694f;

            font-family:
                Arial,
                sans-serif;
        }


        canvas {

            display: block;

            width: 100%;
            height: 100%;
        }


        /* ==================================================
           PANEL INFERIOR
           ================================================== */

        #truckControls {

            position: fixed;

            left: 0;
            bottom: 0;

            width: 100%;

            box-sizing: border-box;

            background:
                rgba(
                    10,
                    14,
                    18,
                    0.90
                );

            backdrop-filter:
                blur(8px);

            color: white;

            font-family:
                Arial,
                sans-serif;

            z-index: 99999;

            border-top:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.18
                );

            box-shadow:
                0 -5px 20px
                rgba(
                    0,
                    0,
                    0,
                    0.35
                );
        }


        /* ==================================================
           ESTADO DEL CAMIÓN
           ================================================== */

        .truckStatus {

            display: flex;

            justify-content: center;

            align-items: stretch;

            gap: 8px;

            padding:
                8px
                10px
                5px;

            flex-wrap: wrap;
        }


        .statusBox {

            min-width: 90px;

            padding:
                5px
                10px;

            text-align: center;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.07
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.12
                );

            border-radius: 6px;
        }


        .statusBox small {

            display: block;

            font-size: 9px;

            color: #aaa;

            margin-bottom: 2px;
        }


        .statusBox strong {

            font-size: 15px;

            color: white;
        }


        .statusBox span {

            font-size: 10px;

            color: #aaa;
        }


        /* ==================================================
           TECLAS
           ================================================== */

        .keyControls {

            display: flex;

            justify-content: center;

            align-items: center;

            flex-wrap: wrap;

            gap: 6px 14px;

            padding:
                6px
                12px
                9px;

            font-size: 12px;

            color: #ddd;
        }


        .keyControls div {

            white-space: nowrap;
        }


        .keyControls b {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            min-width: 24px;

            height: 23px;

            padding:
                0
                5px;

            margin-right: 3px;

            background:
                linear-gradient(
                    #444,
                    #222
                );

            border:
                1px solid
                #777;

            border-bottom:
                2px solid
                #111;

            border-radius: 5px;

            color: white;

            font-size: 12px;

            font-weight: bold;
        }


        /* ==================================================
           PANTALLAS PEQUEÑAS
           ================================================== */

        @media (
            max-width: 800px
        ) {

            .statusBox {

                min-width: 70px;
            }


            .keyControls {

                font-size: 11px;

                gap:
                    5px
                    8px;
            }

        }

    </style>

</head>


<body>


    <!-- ==================================================
         JUEGO
         ================================================== -->

    <canvas
        id="gameCanvas"
    ></canvas>


    <!-- ==================================================
         PANEL INFERIOR DEL CAMIÓN
         ================================================== -->

    <div
        id="truckControls"
    >


        <!-- INFORMACIÓN -->

        <div
            class="truckStatus"
        >


            <div
                class="statusBox"
            >

                <small>
                    VELOCIDAD
                </small>

                <strong
                    id="bottomSpeed"
                >
                    0
                </strong>

                <span>
                    km/h
                </span>

            </div>


            <div
                class="statusBox"
            >

                <small>
                    MARCHA
                </small>

                <strong
                    id="bottomGear"
                >
                    1
                </strong>

            </div>


            <div
                class="statusBox"
            >

                <small>
                    CRUCERO
                </small>

                <strong
                    id="cruiseStatus"
                >
                    OFF
                </strong>

            </div>


            <div
                class="statusBox"
            >

                <small>
                    INTERMITENTES
                </small>

                <strong
                    id="indicatorStatus"
                >
                    —
                </strong>

            </div>


            <div
                class="statusBox"
            >

                <small>
                    LUCES
                </small>

                <strong
                    id="lightsStatus"
                >
                    OFF
                </strong>

            </div>


            <div
                class="statusBox"
            >

                <small>
                    FRENO MOTOR
                </small>

                <strong
                    id="engineBrakeStatus"
                >
                    OFF
                </strong>

            </div>


        </div>


        <!-- ==================================================
             CONTROLES
             ================================================== -->

        <div
            class="keyControls"
        >


            <div>

                <b>W</b>

                Acelerar

            </div>


            <div>

                <b>S</b>

                Frenar

            </div>


            <div>

                <b>A</b>

                Izquierda

            </div>


            <div>

                <b>D</b>

                Derecha

            </div>


            <div>

                <b>+</b>

                Subir marcha

            </div>


            <div>

                <b>−</b>

                Bajar marcha

            </div>


            <div>

                <b>B</b>

                Marcha atrás

            </div>


            <div>

                <b>R</b>

                Repostar

            </div>


            <div>

                <b>J</b>

                Trabajos

            </div>


            <div>

                <b>M</b>

                Mapa

            </div>


        </div>


    </div>


    <!-- ==================================================
         MOTOR DEL JUEGO
         ================================================== -->

    <script
        src="game.js"
    ></script>


</body>

</html>
