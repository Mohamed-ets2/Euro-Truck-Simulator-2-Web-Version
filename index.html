<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truck World</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
            font-family: Arial, sans-serif;
        }

        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background: #496b45;
        }

        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #101820;
            color: white;
            font-size: 28px;
            z-index: 100;
        }

        #error {
            display: none;
            position: fixed;
            left: 20px;
            right: 20px;
            top: 20px;
            padding: 20px;
            background: #8b0000;
            color: white;
            z-index: 200;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

    <div id="loading">
        Cargando Truck World...
    </div>

    <div id="error"></div>

    <canvas id="gameCanvas"></canvas>

    <!--
        IMPORTANTE:
        El orden importa.
        Los datos se cargan primero y el juego después.
    -->

    <script src="cities.js"></script>
    <script src="roads.js"></script>
    <script src="world.js"></script>
    <script src="jobs.js"></script>
    <script src="game.js"></script>

</body>
</html>
