<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truck Driver</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #53694f;
            font-family: Arial, sans-serif;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>


    
<body>

<canvas id="gameCanvas"></canvas>

<script src="game.js"></script>
<div id="truckControls">

    <div class="truckStatus">
        <div class="statusBox">
            <small>VELOCIDAD</small>
            <strong id="bottomSpeed">0</strong>
            <span>km/h</span>
        </div>

        <div class="statusBox">
            <small>MARCHA</small>
            <strong id="bottomGear">N</strong>
        </div>

        <div class="statusBox">
            <small>CRUCERO</small>
            <strong id="cruiseStatus">OFF</strong>
        </div>

        <div class="statusBox">
            <small>INTERMITENTES</small>
            <strong id="indicatorStatus">—</strong>
        </div>

        <div class="statusBox">
            <small>LUCES</small>
            <strong id="lightsStatus">OFF</strong>
        </div>

        <div class="statusBox">
            <small>FRENO MOTOR</small>
            <strong id="engineBrakeStatus">OFF</strong>
        </div>
    </div>

    <div class="keyControls">
        <div><b>W</b> Acelerar</div>
        <div><b>S</b> Frenar</div>
        <div><b>A</b> Izquierda</div>
        <div><b>D</b> Derecha</div>
        <div><b>+</b> Subir marcha</div>
        <div><b>−</b> Bajar marcha</div>
        <div><b>B</b> Marcha atrás</div>
        <div><b>J</b> Trabajos</div>
        <div><b>M</b> Mapa</div>
    </div>

</div>
</body>
</html>
